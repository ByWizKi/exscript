services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: exscript
      POSTGRES_PASSWORD: exscript
      POSTGRES_DB: exscript
    ports:
      - "5435:5432"
    volumes:
      - exscript_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exscript"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      target: development
    ports:
      - "8011:8011"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://exscript:exscript@db:5432/exscript
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/adc.json
    volumes:
      - ./backend:/app
      - ~/.config/gcloud/application_default_credentials.json:/tmp/adc.json:ro
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8011 --reload

  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "3011:3011"
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8011
      PORT: 3011
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  exscript_pgdata:
